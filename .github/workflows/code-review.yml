name: week09_Bai07_Code-review

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'advanced_prog/week_09/Bai07/**'
      - '.github/workflows/code-review.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./advanced_prog/week_09/Bai07

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Checkstyle
        run: mvn checkstyle:checkstyle

      - name: Checkstyle Review Bot
        uses: reviewdog/action-checkstyle@v0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: 'google_checks.xml'
          reporter: github-pr-review
          level: warning
          fail_on_error: true
