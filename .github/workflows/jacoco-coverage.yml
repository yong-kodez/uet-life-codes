name: week09_Bai05_Coverage

on:
  push:
    branches: [ "main" ]
    paths:
      - 'advanced_prog/week_09/Bai05/**'
      - '.github/workflows/jacoco-coverage.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'advanced_prog/week_09/Bai05/**'
      - '.github/workflows/jacoco-coverage.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./advanced_prog/week_09/Bai05

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and verify
        run: mvn clean verify

      - name: Upload JaCoCo Coverage Report
        if: always() # Chạy ngay cả khi bước trước pass hoặc fail để xem chi tiết
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
