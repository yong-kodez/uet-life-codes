name: week09_Bai04_Matrix

on:
  push:
    branches: [ "main" ]
    paths:
      - 'advanced_prog/week_09/Bai04/**'
      - '.github/workflows/matrix-test.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'advanced_prog/week_09/Bai04/**'
      - '.github/workflows/matrix-test.yml'

jobs:
  build:
    defaults:
      run:
        working-directory: ./advanced_prog/week_09/Bai04

    strategy:
      fail-fast: false 
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test 
        run: mvn clean test
