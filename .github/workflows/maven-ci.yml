name: week09_Bai03_CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'advanced_prog/week_09/Bai03/**'
      - '.github/workflows/maven-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'advanced_prog/week_09/Bai03/**'
      - '.github/workflows/maven-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./advanced_prog/week_09/Bai03

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'termurin'
          cache: maven

      - name: Run tests and packages
        run: mvn test package

      - name: Upload Build Artifact (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: my-ci-test
          path: advanced_prog/week_09/Bai03/target/*.jar
          if-no-files-found: error
